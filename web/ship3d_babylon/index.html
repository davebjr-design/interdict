<!doctype html><html><head><meta charset="utf-8"><title>Interdict: 3D ship spine (Babylon.js)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0c1618;color:#d7e3ea;font:13px Helvetica,Arial,sans-serif;overflow:hidden}
canvas{width:100%;height:100%;display:block;outline:none}
#hud{position:fixed;left:12px;top:10px;pointer-events:none;line-height:1.5}#hud b{color:#c9a24a}
#decks{position:fixed;right:10px;top:10px;display:flex;flex-direction:column;gap:3px;max-height:92vh;overflow:auto}
#decks button,#shipbtn,#cams button{background:#1d3340;color:#d7e3ea;border:1px solid #3c6074;border-radius:4px;padding:4px 8px;font:12px inherit;cursor:pointer;text-align:left}
#decks button.on,#cams button.on{background:#c9a24a;color:#111}#shipbtn{position:fixed;left:12px;bottom:12px}
#tip{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);color:#8ca3b0}</style></head><body>
<canvas id="c"></canvas><div id="hud"></div><div id="decks"></div><button id="shipbtn">Ship view</button>
<div id="tip">Click the floor to walk. Drag to orbit, wheel to zoom. Pick a deck to walk to a shaft door and climb.</div>
<script src="babylon.js"></script><script src="babylonjs.loaders.min.js"></script><script src="hunt/flight_model.js"></script><script src="hunt/hunt_rt_engine.js"></script><script src="hunt/station_model.js"></script><script src="hunt/salvo_presets.js"></script><script src="hunt/station_adapter.js"></script><script src="hunt/annunciator.js"></script><script src="hunt/live_screens.js"></script><script src="hunt/audio.js"></script><script src="hunt/ctl_bjs.js"></script><script src="hunt/airlock_sys.js"></script><script src="hunt/ship_systems.js"></script><script src="hunt/passive_screens.js"></script><script src="ship3d_bjs.js"></script></body></html>
