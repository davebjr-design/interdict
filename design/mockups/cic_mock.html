:root{--bg:#050b09;--line:#1d3a34;--txt:#b9d3c9;--dim:#6f8f85;--amber:#e8a33a;--teal:#35d3c8}

#state{left:14px;bottom:16px;max-width:370px;color:var(--dim)}
