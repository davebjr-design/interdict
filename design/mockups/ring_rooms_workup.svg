<text x="60" y="64" fill="#e6f0ff" font-size="34" font-weight="700">Ring rooms: a very simple workup</text>
<text x="60" y="96" fill="#9db4d1" font-size="19">Each pressure cell is a drum along the ship's axis. Decks are discs stacked fore and aft. Under thrust, "down" is aft.</text>

