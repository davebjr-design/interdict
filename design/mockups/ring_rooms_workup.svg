<text x="1220" y="1042" fill="#e8a54b" font-size="15" text-anchor="middle">amber ring: lithium annulus behind the wall</text>
<text x="880" y="1074" fill="#9db4d1" font-size="16">The CIC already is a round room in plan, so only the direction of "down" changes.</text>
<text x="60" y="1070" fill="#9db4d1" font-size="16">Gains: real weight at cruise thrust, hull-ring look, decks that stack like Ohio frames.  Costs: the room art and the CIC floor are re-planned (floor becomes the aft face); stairs become a central trunk and ladder.</text>
